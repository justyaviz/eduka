<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="/app/app-leads-v07.css?v=0.7.0">
  <link rel="stylesheet" href="/app/app-settings-v08.css?v=0.9.9">
  <link rel="stylesheet" href="/app/app-branches-v083.css?v=0.8.3">
  <link rel="stylesheet" href="/app/app-edutizim-shell-v090.css?v=0.9.0-v2">

<body class="edutizim-client-v090 eduka-brandbook-v1 eduka-brandbook-v101">
  <div class="boot-loader" id="bootLoader"><span></span><span></span><span></span></div>

  <main class="crm-shell">
    <aside class="sidebar" aria-label="Asosiy navigatsiya">
      <div class="side-top">
        <div class="tenant-brand-mark" aria-label="EDUKA">
          <img src="/assets/logo-icon.png" alt="EDUKA" class="tenant-brand-logo">
        </div>
        <div class="client-brand-static"><b>EDUKA</b><small>Education CRM</small></div>
        <button class="quick-add" id="quickAddBtn" type="button" title="Tez qo‘shish" aria-label="Tez qo‘shish" data-icon="plus"></button>
      </div>

      <div class="quick-pop" id="quickPop" hidden>
        <button data-open-drawer="student"><span data-icon="user-plus"></span> Yangi o‘quvchi</button>
        <button data-open-drawer="teacher"><span data-icon="teacher"></span> Yangi o‘qituvchi</button>
        <button data-open-drawer="group"><span data-icon="layers"></span> Yangi guruh</button>
        <button data-open-drawer="payment"><span data-icon="wallet"></span> To‘lov</button>
      </div>

      <div class="side-scroll">
        <div class="client-nav-group">Asosiy</div>
        <nav class="side-nav" id="sideNav">
          <button data-page="dashboard" class="active"><span data-icon="home"></span><em>Bosh sahifa</em></button>
          <button data-page="reminders"><span data-icon="clock"></span><em>Topshiriqlar</em></button>

          <div class="client-nav-group">CRM</div>
          <button data-page="leads"><span data-icon="user-plus"></span><em>Lidlar</em></button>
          <button data-page="groups"><span data-icon="layers"></span><em>Guruhlar</em></button>
          <button data-page="students"><span data-icon="graduation"></span><em>O‘quvchilar</em></button>
          <button data-page="teachers"><span data-icon="teacher"></span><em>O‘qituvchilar</em></button>
          <button data-page="courses"><span data-icon="presentation"></span><em>O‘quv bo‘limi</em></button>

          <div class="client-nav-group">Boshqaruv</div>
          <button data-page="finance"><span data-icon="coin"></span><em>Moliya</em></button>
          <button data-page="reports"><span data-icon="chart"></span><em>Hisobotlar</em></button>
          <button data-page="settings"><span data-icon="settings"></span><em>Sozlamalar</em></button>
        </nav>
      </div>

      <div class="client-sidebar-bottom">
        <a href="https://t.me/eduka_sales" target="_blank" rel="noreferrer"><span data-icon="help"></span><span>Texnik yordam</span></a>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <button id="clientBackStaticV090" class="client-back-static" type="button" aria-label="Orqaga" title="Orqaga">‹</button>

        <div class="crm-page-context">
          <div class="crm-center-avatar" id="shellCenterAvatar">CR</div>
          <div class="crm-context-copy">
            <div class="crm-breadcrumb">EDUKA CRM <span>•</span> <b id="shellPageTitle">Bosh sahifa</b></div>
            <strong id="shellCenterName">O‘quv markaz</strong>
            <small id="shellSubdomain">markaz.eduka.uz</small>
          </div>
        </div>

        <label class="client-global-search" for="clientGlobalSearchV090">
          <span data-icon="search"></span>
          <input id="clientGlobalSearchV090" autocomplete="off" placeholder="Qidirish..." aria-label="Global qidiruv">
          <kbd>Ctrl K</kbd>
        </label>

        <div class="license" role="status" aria-live="polite">
          <span data-icon="calendar"></span>
          <b>Obuna:</b>
          <strong id="licenseUntil">—</strong>
          <em id="licenseStatus">Yuklanmoqda</em>
          <button type="button">Batafsil</button>
          <button type="button" class="primary">To‘lash</button>
        </div>

        <div class="top-actions">
          <button id="fullScreenBtn" type="button" title="To‘liq ekran" aria-label="To‘liq ekran" data-icon="maximize"></button>
          <a href="https://t.me/eduka_sales" target="_blank" rel="noreferrer" title="Yordam" aria-label="Yordam" class="shell-help"><span data-icon="help"></span></a>
          <button class="profile" id="profileBtn" type="button" aria-label="Profil menyusi">
            <span class="avatar" id="shellProfileAvatar">CR</span>
            <b id="profileName">CRM</b>
          </button>
        </div>

        <button class="lang" id="langBtn" type="button" hidden>UZ</button>
        <div class="menu-pop lang-pop" id="langPop" hidden>
          <button>uz - O‘zbekcha</button>
          <button>ru - Русский</button>
          <button>en - English</button>
        </div>

        <div class="menu-pop profile-pop" id="profilePop" hidden>
          <button type="button" data-shell-settings><span data-icon="user-check"></span> Profil va xavfsizlik</button>
          <button id="logoutBtn" type="button"><span data-icon="user-x"></span> Chiqish</button>
        </div>
      </header>

      <section class="content" id="content"></section>

      <footer class="footer">
        <a href="https://t.me/eduka_sales" target="_blank" rel="noreferrer"><span data-icon="help"></span> Texnik yordam</a>
        <span><i class="crm-system-dot"></i> Tizim ishlamoqda</span>
        <span><span data-icon="info"></span> EDUKA CRM</span>
        <strong>EDUKA</strong>
      </footer>
    </section>
  </main>

  <button class="floating-calendar" type="button" data-icon="calendar" aria-hidden="true" tabindex="-1"></button>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Amal oynasi">
    <button class="drawer-close" id="drawerClose" type="button" aria-label="Yopish">×</button>
    <h2 id="drawerTitle">Qo‘shish</h2>
    <div id="drawerBody"></div>
  </aside>

  <script src="/app/app.js?v=client-ready-1"></script>
  <script src="/eduka-ui-v11.js?v=1.1.0"></script>
  <script src="/app/app-ui-bridge-v11.js?v=1.1.0"></script>
  <script src="/app/app-api-cache-v0983.js?v=1.0.1"></script>
  <script src="/app/app-shell-v01.js?v=0.1.1"></script>
  <script src="/app/app-dashboard-v02.js?v=0.2.0"></script>
  <script src="/app/app-students-v03.js?v=0.3.0"></script>
  <script src="/app/app-academic-v04.js?v=0.4.0"></script>
  <script src="/app/app-attendance-reminders-v05.js?v=0.5.0"></script>
  <script src="/app/app-finance-v06.js?v=0.6.0"></script>
  <script src="/app/app-leads-v07.js?v=0.7.0"></script>
  <script src="/app/app-leads-v07-hotfix.js?v=0.7.1"></script>
  <script src="/app/app-settings-v08.js?v=0.9.9"></script>
  <script src="/app/app-branches-v083.js?v=0.8.3"></script>
  <script src="/app/app-edutizim-shell-v090.js?v=1.0.1"></script>
  <script>
    if(!new URLSearchParams(location.search).has('day')){
      const dashboardUrl=new URL(location.href);
      dashboardUrl.searchParams.set('day',String(new Date().getDay()));
      history.replaceState(history.state,'',dashboardUrl.pathname+'?'+dashboardUrl.searchParams.toString());
    }
  </script>
  <script src="/app/app-dashboard-edutizim-v091.js?v=0.9.1"></script>
  <script src="/app/app-tasks-edutizim-v092.js?v=0.9.2"></script>
  <script src="/app/app-leads-edutizim-v093.js?v=0.9.3"></script>
  <script src="/app/app-groups-edutizim-v094.js?v=0.9.4"></script>
  <script src="/app/app-students-edutizim-v095.js?v=0.9.5"></script>
  <script src="/app/app-teachers-academic-edutizim-v096.js?v=0.9.6"></script>
  <script src="/app/app-finance-payroll-edutizim-v097.js?v=0.9.7"></script>
  <script src="/app/app-reports-edutizim-v098.js?v=0.9.8"></script>
</body>
</html>
