<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EDUKA CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/app.css?v=crm-rebuild-1">
</head>
<body>
  <div class="boot-loader" id="bootLoader"><span></span><span></span><span></span></div>

  <main class="crm-shell">
    <aside class="sidebar">
      <div class="side-top">
        <div class="logo-mark" data-icon="arrow-up-right"></div>
        <button class="quick-add" id="quickAddBtn" title="Tez qo‘shish" data-icon="plus"></button>
      </div>

      <div class="quick-pop" id="quickPop" hidden>
        <button data-open-drawer="student"><span data-icon="user-plus"></span> Yangi talaba</button>
        <button data-open-drawer="teacher"><span data-icon="teacher"></span> Yangi o‘qituvchi</button>
        <button data-open-drawer="group"><span data-icon="layers"></span> Yangi guruh</button>
        <button data-open-drawer="payment"><span data-icon="wallet"></span> To‘lov</button>
      </div>

      <nav class="side-nav" id="sideNav">
        <button data-page="dashboard" class="active"><span data-icon="home"></span><em>Dashboard</em></button>
        <button data-page="leads"><span data-icon="download"></span><em>Lidlar</em></button>
        <button data-page="teachers"><span data-icon="teacher"></span><em>O‘qituvchilar</em></button>
        <button data-page="groups"><span data-icon="layers"></span><em>Guruhlar</em></button>
        <button data-page="students"><span data-icon="graduation"></span><em>Talabalar</em></button>
        <button data-page="reminders"><span data-icon="clock"></span><em>Eslatmalar</em></button>
        <button data-page="rating"><span data-icon="trophy"></span><em>Reyting</em></button>
        <button data-page="attendance"><span data-icon="calendar"></span><em>Davomat</em></button>
        <button data-page="teacher-attendance"><span data-icon="calendar-check"></span><em>Ustozlar davomati</em></button>
        <button data-page="finance"><span data-icon="coin"></span><em>Moliya</em></button>
        <button data-page="reports"><span data-icon="chart"></span><em>Hisobotlar</em></button>
        <button data-page="settings"><span data-icon="settings"></span><em>Sozlamalar</em></button>
      </nav>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="brand">
          <strong>EDUKA CRM</strong>
          <small>O‘quv markaz boshqaruvi</small>
        </div>

        <label class="search">
          <span data-icon="search"></span>
          <input id="globalSearch" placeholder="Qidiruv">
        </label>

        <div class="top-actions">
          <button class="lang" id="langBtn">UZ</button>
          <button title="Fullscreen" data-icon="maximize"></button>
          <button title="Yordam" data-icon="help"></button>
          <button title="Soat" data-icon="clock"></button>
          <button title="Bildirishnoma" data-icon="bell"></button>
          <button class="profile" id="profileBtn"><span class="avatar"></span><b id="profileName">YAHYOBEK</b></button>
        </div>

        <div class="menu-pop lang-pop" id="langPop" hidden>
          <button>uz - O‘zbekcha</button>
          <button>ru - Русский</button>
          <button>en - English</button>
        </div>

        <div class="menu-pop profile-pop" id="profilePop" hidden>
          <button>Hisob qaydnomasi</button>
          <button id="logoutBtn">Chiqish</button>
        </div>
      </header>

      <div class="license">
        <span data-icon="calendar"></span>
        <b>Litsenziyaning platformaga amal qilish muddati:</b>
        <strong>03.06.2026 - 23:59</strong>
        <em>7 kundan kam vaqt qoldi</em>
        <button>Batafsil</button>
        <button class="primary">To‘lash</button>
      </div>

      <section class="content" id="content"></section>

      <footer class="footer">
        <span><span data-icon="help"></span> Texnik yordam</span>
        <span><span data-icon="play"></span> Video darsliklar</span>
        <span><span data-icon="info"></span> To‘lov rejimi: Oylik</span>
        <strong>EDUKA</strong>
      </footer>
    </section>
  </main>

  <button class="floating-calendar" data-icon="calendar"></button>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <button class="drawer-close" id="drawerClose">×</button>
    <h2 id="drawerTitle">Qo‘shish</h2>
    <div id="drawerBody"></div>
  </aside>

  <script src="/app/app.js?v=crm-rebuild-1"></script>
</body>
</html>
